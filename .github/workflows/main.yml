name: Build Evolution-X GSI

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدويًا من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. تفريغ مساحة في الخادم (لأن بناء أندرويد يتطلب مساحة تخزين ضخمة)
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      # 2. تثبيت الحزم والأدوات المطلوبة لبناء AOSP/Treble
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev \
            libc6-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev \
            python3 python3-pip openjdk-11-jdk
          
          # تثبيت أداة Repo
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # 3. إعداد هويّة Git
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # 4. تهيئة المستودع (repo init) ومزامنته (repo sync)
      - name: Sync Source Code
        run: |
          mkdir -p android-build
          cd android-build
          repo init -u https://github.com/Evolution-X/manifest -b cnb --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      # 5. إعداد البيئة وبناء الـ GSI / Target
      - name: Build GSI
        run: |
          cd android-build
          . build/envsetup.sh
          # اختيار هدف البناء المطلوب
          lunch lineage_arm64_bgS-userdebug || lunch lineage_codename-cp2a-userdebug
          
          # بدء عملية التجميع
          m evolution -j$(nproc --all) || m systemimage -j$(nproc --all)

      # 6. ضغط ملف الصورة الناتج ورفعه للتحميل
      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvolutionX-GSI
          path: android-build/out/target/product/*/*.img
